<article class="reading">
    <h1 class="section-title">Blog</h1>

    <p *ngIf="error">The blog could not be loaded.</p>

    <p *ngIf="loaded && !error && posts.length === 0">No posts yet.</p>

    <ul class="blog-list" *ngIf="loaded && !error">
        <li *ngFor="let post of posts">
            <a [routerLink]="['/blog', post.slug]">
                <h2>{{ post.title }}</h2>
                <p class="blog-subtitle" *ngIf="post.subtitle">{{ post.subtitle }}</p>
                <p class="blog-meta">{{ formatDate(post.date) }} · {{ post.minutes }} min read</p>
            </a>
        </li>
    </ul>
</article>
